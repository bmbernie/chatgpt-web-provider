# Non-secret ChatGPT Web Provider configuration.
# Environment variables override values in this file.
# API keys intentionally remain environment-only.

[provider]
backend = "browser"

[chatgpt]
base_url = "https://chatgpt.com/"
model = "chatgpt-5.6-sol-web"
models = [
  "chatgpt-5.6-sol-web",
  "gpt-5.6-terra",
  "gpt-5.6-luna",
  "gpt-5.5",
  "gpt-5.4",
  "gpt-5.4-mini",
  "gpt-5.3",
  "gpt-5.3-codex-spark",
  "o3",
]

model_labels = {
  "chatgpt-5.6-sol-web" = "GPT-5.6 Sol",
  "gpt-5.6-terra" = "5.6 Terra",
  "gpt-5.6-luna" = "5.6 Luna",
  "gpt-5.5" = "GPT-5.5",
  "gpt-5.4" = "GPT-5.4",
  "gpt-5.4-mini" = "5.4 Mini",
  "gpt-5.3" = "GPT-5.3",
  "gpt-5.3-codex-spark" = "5.3 Codex Spark",
  "o3" = "o3",
}

levels = ["auto", "fast", "standard", "high"]
level_labels = {
  auto = "Auto",
  fast = "Fast",
  standard = "Standard",
  high = "High",
}

session_policy = "regular"

[server]
host = "127.0.0.1"
port = 8791
public_base_url = "http://127.0.0.1:8791"

[browser]
profile_dir = "~/.local/share/chatgpt-web-provider/chrome-profile"
headless = true
channel = ""
enable_extensions = false
viewport_width = 1360
viewport_height = 820

[transport]
# Prompts below this size use Playwright fill().
inline_fill_max_chars = 16384

# Larger prompts are pasted inline in chunks to avoid ChatGPT's
# special large-paste attachment behavior.
clipboard_chunk_size = 4096

[timeouts]
request_seconds = 300
queue_seconds = 600
navigation_ms = 60000
composer_ready_ms = 30000
policy_launch_ms = 30000
policy_ready_ms = 10000
reasoning_control_ms = 45000

# Maximum time to wait for ChatGPT generation to finish.
generation_seconds = 240
generation_poll_ms = 1000
generation_settle_ms = 1500

# Delay after navigating to or explicitly creating a fresh chat.
new_session_settle_ms = 1500

# Model/reasoning picker interaction.
picker_ready_ms = 5000
picker_transition_ms = 5000
ui_action_ms = 3000

# Send-button readiness and post-click confirmation.
submit_ready_ms = 30000
submit_confirm_ms = 5000

[queue]
max_concurrent_requests = 1

[rate_limit]
# Advisory only. Omit when the actual reset time is unknown.
# retry_after_seconds = 300
